<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trackello &ndash; Shipping</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="trackello">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="shell.js"></script>
</head>
<body>
<header class="top">
  <div class="hbar">
    <a href="index.html" class="back" aria-label="Back to home">&lsaquo;</a>
    <h2>Shipping</h2>
    <span class="hbar-spacer" aria-hidden="true"></span>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-stab="toship" role="tab">To ship</button>
    <button type="button" class="tab" data-stab="shipped" role="tab">Shipped</button>
  </nav>
</header>

<main class="port-wrap">
  <div class="port-summary">
    <span>Total shipping</span>
    <b id="shipTotal">PHP 0.00</b>
    <button type="button" class="ghost sm" id="shipRefresh">Refresh</button>
  </div>
  <div class="field" style="margin-bottom:12px">
    <input type="search" id="shipSearch" placeholder="Search card, buyer, method, address, contact or notes" autocomplete="off">
  </div>
  <div class="rec-filter">
    <div class="rec-dates">
      <div class="field"><label for="shipFrom" id="shipFromLbl">Scheduled from</label><input type="date" id="shipFrom"></div>
      <div class="field"><label for="shipTo" id="shipToLbl">Scheduled to</label><input type="date" id="shipTo"></div>
    </div>
    <div class="rec-tools">
      <button type="button" class="ghost sm" id="shipClear">Clear search &amp; dates</button>
    </div>
    <p class="rec-count" id="shipCount"></p>
  </div>
  <div class="ship-alert" id="shipAlert" role="alert" hidden></div>
  <p class="stub-note" id="shipState">Loading&hellip;</p>
  <div id="shipList" class="port-list" hidden></div>
</main>

<div class="modal" id="imgView" hidden>
  <div class="sheet small">
    <img id="imgViewImg" alt="">
    <div class="acts"><button type="button" class="ghost" id="imgViewClose">Close</button></div>
  </div>
</div>

<input type="file" accept="image/*" id="shipFileCamera" capture="environment" hidden>
<input type="file" accept="image/*" id="shipFileUpload" hidden>

<div class="modal" id="shipPhotoSheet" hidden>
  <div class="sheet small">
    <h3 id="shipPsTitle">Attach proof of shipment</h3>
    <div class="acts">
      <button type="button" class="ghost" id="shipPsCamera">Take a picture</button>
      <button type="button" class="ghost" id="shipPsUpload">Upload from device</button>
      <button type="button" class="ghost" id="shipPsLink">Paste image link</button>
      <div class="field" id="shipPsLinkField" hidden>
        <input type="url" id="shipPsLinkInput" placeholder="https://example.com/proof.jpg" inputmode="url">
        <button type="button" class="go sm" id="shipPsLinkUse">Use link</button>
      </div>
      <button type="button" class="ghost danger" id="shipPsRemove" hidden>Remove photo</button>
      <button type="button" class="ghost" id="shipPsCancel">Cancel</button>
    </div>
  </div>
</div>
<div class="modal" id="shipDateSheet" hidden>
  <div class="sheet small wide">
    <h3 id="shipDateHeading">Mark as shipped</h3>
    <div class="field">
      <label for="shipDateIn">Shipped on <small>(time optional)</small></label>
      <div class="row">
        <input type="date" id="shipDateIn">
        <input type="time" id="shipTimeIn" aria-label="Time">
      </div>
    </div>
    <div class="field" id="shipDateMethodWrap" hidden>
      <label for="shipDateMethod">Shipping method</label>
      <select id="shipDateMethod"><option>LBC</option><option>Lalamove</option><option>Grab</option><option>Meet-up</option><option>Others</option></select>
      <input type="text" id="shipDateMethodOther" placeholder="Specify shipping method" hidden>
    </div>
    <div class="field" id="shipDateNotesWrap" hidden>
      <label for="shipDateNotes">Notes <small>(optional)</small></label>
      <textarea id="shipDateNotes" rows="3" maxlength="500" placeholder="Notes from the receipt"></textarea>
    </div>
    <div class="acts">
      <button type="button" class="go sm" id="shipDateSave">Mark shipped</button>
      <button type="button" class="ghost" id="shipDateCancel">Cancel</button>
    </div>
  </div>
</div>
<div class="modal" id="shipEditSheet" hidden>
  <div class="sheet small wide">
    <h3>Edit shipping details</h3>
    <div class="field">
      <label for="shipEditMethod">Shipping method</label>
      <select id="shipEditMethod"><option>LBC</option><option>Lalamove</option><option>Grab</option><option>Meet-up</option><option>Others</option></select>
      <input type="text" id="shipEditMethodOther" placeholder="Specify shipping method" hidden>
    </div>
    <div class="field">
      <label for="shipEditSched">Scheduled shipping date <small>(optional)</small></label>
      <div class="row">
        <input type="date" id="shipEditSched">
        <button type="button" class="ghost sm" id="shipEditClear">Clear</button>
      </div>
    </div>
    <div class="field">
      <label for="shipEditAddr">Shipping address <small>(optional)</small></label>
      <textarea id="shipEditAddr" rows="4" placeholder="Name, street, barangay, city, province, ZIP"></textarea>
    </div>
    <div class="field">
      <label for="shipEditContact">Contact number <small>(optional)</small></label>
      <input type="tel" id="shipEditContact" inputmode="tel" autocomplete="off" placeholder="09xx xxx xxxx">
    </div>
    <div class="field">
      <label for="shipEditNotes">Notes <small>(optional)</small></label>
      <textarea id="shipEditNotes" rows="3" maxlength="500" placeholder="Notes from the receipt, reminders for packing&hellip;"></textarea>
    </div>
    <div class="acts">
      <button type="button" class="go sm" id="shipEditSave">Save changes</button>
      <button type="button" class="ghost" id="shipEditCancel">Cancel</button>
    </div>
  </div>
</div>
<div class="toast" id="shipToast" hidden></div>

<footer class="site-footer">
  <p>&copy;2026 Court Vision<br>All rights reserved.</p>
  <p>trackello <span class="ver">v1.2</span></p>
</footer>
<script src="boot.js"></script>
<script src="config.js"></script>
<script src="net.js"></script>
<script src="shipping.js"></script>
</body>
</html>
