<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trackello &ndash; Finance</title>
<meta name="theme-color" content="#f7f7f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="trackello">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="hbar">
    <a href="index.html" class="back" aria-label="Back to home">&lsaquo;</a>
    <h2>Finance</h2>
    <span class="hbar-spacer" aria-hidden="true"></span>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-ftab="torecord" role="tab">To record</button>
    <button type="button" class="tab" data-ftab="recorded" role="tab">Recorded</button>
  </nav>
</header>

<main class="port-wrap">
  <div class="port-summary">
    <span>Total</span>
    <b id="finTotal">PHP 0.00</b>
    <button type="button" class="ghost sm" id="finRefresh">Refresh</button>
  </div>
  <button type="button" class="ghost add-task" id="finAdd">+ Add task</button>
  <p class="stub-note" id="finState">Loading&hellip;</p>
  <div id="finList" class="port-list" hidden></div>
</main>

<div class="modal" id="taskSheet" hidden>
  <div class="sheet small">
    <h3>Add task</h3>
    <p class="stub-note" style="margin:-6px 0 14px;font-size:12px;text-align:center">A standalone task. It isn&rsquo;t linked to any card or receipt.</p>
    <div class="field">
      <label for="taskDesc">Description</label>
      <input type="text" id="taskDesc" autocomplete="off" placeholder="e.g. Reimburse Justine">
    </div>
    <div class="field">
      <label>Money</label>
      <div class="radios">
        <label class="rad"><input type="radio" name="taskFlow" value="outflow" checked><span>Outflow</span></label>
        <label class="rad"><input type="radio" name="taskFlow" value="inflow"><span>Inflow</span></label>
        <label class="rad"><input type="radio" name="taskFlow" value="none"><span>None</span></label>
      </div>
    </div>
    <div class="field" id="taskMoney">
      <label for="taskAmt">Amount</label>
      <div class="money"><em>PHP</em><input type="number" id="taskAmt" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
    </div>
    <div class="field" id="taskPayWrap">
      <label for="taskPay">Paid / received using</label>
      <select id="taskPay"><option>Cash</option><option>Maribank</option><option>Others</option></select>
      <input type="text" id="taskPayOther" placeholder="Specify" hidden>
    </div>
    <div class="field">
      <label for="taskDate">Date</label>
      <input type="date" id="taskDate">
    </div>
    <div class="acts">
      <button type="button" class="go sm" id="taskSave">Add task</button>
      <button type="button" class="ghost" id="taskCancel">Cancel</button>
    </div>
  </div>
</div>
<input type="file" accept="image/*" id="finFileCamera" capture="environment" hidden>
<input type="file" accept="image/*" id="finFileUpload" hidden>
<div class="modal" id="rcptSheet" hidden>
  <div class="sheet small">
    <h3>Task receipt</h3>
    <div class="acts">
      <button type="button" class="ghost" id="rsView" hidden>View current receipt</button>
      <button type="button" class="ghost" id="rsCamera">Take a picture</button>
      <button type="button" class="ghost" id="rsUpload">Upload from device</button>
      <button type="button" class="ghost" id="rsLink">Paste image link</button>
      <div class="field" id="rsLinkField" hidden>
        <input type="url" id="rsLinkInput" placeholder="https://example.com/receipt.jpg" inputmode="url">
        <button type="button" class="go sm" id="rsLinkUse">Use link</button>
      </div>
      <button type="button" class="ghost" id="rsExisting">Link an existing receipt</button>
      <div class="rs-list" id="rsList" hidden></div>
      <button type="button" class="ghost danger" id="rsRemove" hidden>Remove receipt</button>
      <button type="button" class="ghost" id="rsCancel">Cancel</button>
    </div>
  </div>
</div>
<div class="toast" id="finToast" hidden></div>

<footer class="site-footer">
  <p>&copy;2026 Court Vision<br>All rights reserved.</p>
  <p>trackello <span class="ver">v1.2</span></p>
</footer>
<script src="boot.js"></script>
<script src="config.js"></script>
<script src="finance.js"></script>
</body>
</html>
