<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trackello &ndash; Portfolio</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="trackello">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="shell.js"></script>
</head>
<body>
<header class="top">
  <div class="hbar" style="margin-bottom:0">
    <a href="index.html" class="back" aria-label="Back to home">&lsaquo;</a>
    <h2>Portfolio</h2>
    <span class="hbar-spacer" aria-hidden="true"></span>
  </div>
</header>

<main class="port-wrap">
  <div class="port-summary stacked">
    <div class="sum-main"><b id="portTotal">PHP 0</b><span>Total value</span></div>
    <span class="port-count" id="portCount" aria-live="polite"></span>
    <div class="sum-tools">
      <button type="button" class="icon-btn" id="portFixTitles" aria-label="Fix card titles (title case)" title="Fix card titles (title case)" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="16.4" text-anchor="middle" font-size="11.5" font-weight="700" font-family="Inter,system-ui,sans-serif" fill="currentColor">Aa</text></svg></button>
      <button type="button" class="icon-btn" id="portNewLot" aria-label="New lot (group of cards)" title="New lot (group of cards)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="cf" x="7.5" y="6" width="9" height="13" rx="1.6" fill="var(--panel)" transform="rotate(-17 12 20)"/><rect class="cf" x="7.5" y="6" width="9" height="13" rx="1.6" fill="var(--panel)" transform="rotate(17 12 20)"/><rect class="cf" x="7.5" y="5" width="9" height="14" rx="1.6" fill="var(--panel)"/></svg></button>
      <button type="button" class="icon-btn" id="portRefresh" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 00-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0014.5 4.5L20 16"/><path d="M20 20v-4h-4"/></svg></button>
    </div>
  </div>
  <div class="field" style="margin-bottom:12px">
    <input type="search" id="portSearch" placeholder="Search by item name" autocomplete="off">
  </div>
  <div class="filter-chips" id="portFilters">
    <button type="button" class="chip active" data-tag="onhand">Onhand</button>
    <button type="button" class="chip" data-tag="pending">Pending</button>
    <button type="button" class="chip" data-tag="shipping">Shipping</button>
    <button type="button" class="chip" data-tag="sold">Sold</button>
    <button type="button" class="chip" data-tag="safekeep">Safekeep</button>
    <button type="button" class="chip" data-tag="traded">Traded</button>
    <button type="button" class="chip" data-tag="all">All</button>
    <button type="button" class="chip" data-tag="auction">Auction</button>
  </div>
  <p class="stub-note" id="portState">Loading&hellip;</p>
  <div id="portList" class="port-list" hidden></div>
</main>

<div class="modal" id="imgView" hidden>
  <div class="sheet small">
    <img id="imgViewImg" alt="">
    <div class="acts"><button type="button" class="ghost" id="imgViewClose">Close</button></div>
  </div>
</div>
<div class="modal" id="lotAddSheet" hidden>
  <div class="sheet small wide">
    <h3 id="lotAddTitle">Add cards to lot</h3>
    <p class="stub-note" style="margin:-6px 0 14px;font-size:12px;text-align:center">Onhand cards that are not in a lot yet.</p>
    <div class="field" id="lotAddNameWrap" hidden><label for="lotAddName">Lot name <small>(optional)</small></label><input type="text" id="lotAddName" autocomplete="off" placeholder="e.g. Prizm base lot"></div>
    <div class="field" style="margin-bottom:8px"><input type="search" id="lotAddSearch" placeholder="Search cards" autocomplete="off"></div>
    <div id="lotAddList" class="lot-pick"></div>
    <div class="acts">
      <button type="button" class="go sm" id="lotAddSave">Add to lot</button>
      <button type="button" class="ghost" id="lotAddCancel">Cancel</button>
    </div>
  </div>
</div>
<div class="modal" id="rcptView" hidden>
  <div class="sheet">
    <div id="rcptViewBody"></div>
    <div class="acts"><button type="button" class="ghost" id="rcptViewClose">Close</button></div>
  </div>
</div>

<input type="file" accept="image/*" id="portFileCamera" capture="environment" hidden>
<input type="file" accept="image/*" id="portFileUpload" hidden>

<div class="modal" id="portPhotoSheet" hidden>
  <div class="sheet small">
    <h3>Item photo</h3>
    <div class="acts">
      <button type="button" class="ghost" id="portPsCamera">Take a picture</button>
      <button type="button" class="ghost" id="portPsUpload">Upload from device</button>
      <button type="button" class="ghost" id="portPsLink">Paste image link</button>
      <div class="field" id="portPsLinkField" hidden>
        <input type="url" id="portPsLinkInput" placeholder="https://example.com/photo.jpg" inputmode="url">
        <button type="button" class="go sm" id="portPsLinkUse">Use link</button>
      </div>
      <button type="button" class="ghost danger" id="portPsRemove" hidden>Remove photo</button>
      <button type="button" class="ghost" id="portPsCancel">Cancel</button>
    </div>
  </div>
</div>
<div class="toast" id="portToast" hidden></div>

<footer class="site-footer">
  <p>&copy;2026 Court Vision<br>All rights reserved.</p>
  <p>trackello <span class="ver">v1.2</span></p>
</footer>
<script src="boot.js"></script>
<script src="config.js"></script>
<script src="net.js"></script>
<script src="titlecase.js"></script>
<script src="listsort.js"></script>
<script src="portfolio.js"></script>
</body>
</html>
