<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trackello &ndash; Marketing</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="trackello">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="shell.js"></script>
</head>
<body>
<header class="top">
  <div class="hbar">
    <a href="index.html" class="back" aria-label="Back to home">&lsaquo;</a>
    <h2>Marketing</h2>
    <span class="hbar-spacer" aria-hidden="true"></span>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-mtab="rank" role="tab">Rankings</button>
    <button type="button" class="tab" data-mtab="ent" role="tab">Entities</button>
  </nav>
</header>

<main class="port-wrap">
  <div id="panelRank">
    <div class="filter-chips" id="mkKinds">
      <button type="button" class="chip active" data-kind="buy">Buying from</button>
      <button type="button" class="chip" data-kind="sell">Selling to</button>
      <button type="button" class="chip" data-kind="trade">Trading with</button>
    </div>
    <div class="rec-filter">
      <div class="rec-dates">
        <div class="field"><label for="mkFrom">From</label><input type="date" id="mkFrom"></div>
        <div class="field"><label for="mkTo">To</label><input type="date" id="mkTo"></div>
      </div>
      <div class="rec-tools">
        <button type="button" class="ghost sm" id="mkClear">Clear dates</button>
        <button type="button" class="ghost sm" id="mkRefresh">Refresh</button>
      </div>
    </div>
    <div class="mk-sum" id="mkSum" hidden><span id="mkSumLbl"></span><div class="mk-sumr"><b id="mkSumVal"></b><small id="mkSumSub" hidden></small></div></div>
    <p class="stub-note" id="mkState">Loading&hellip;</p>
    <div class="mk-list" id="mkList" hidden></div>
  </div>

  <div id="panelEnt" hidden>
    <div class="field" style="margin-bottom:12px">
      <input type="search" id="entSearch" placeholder="Search name, contact, address, email or notes" autocomplete="off">
    </div>
    <button type="button" class="ghost add-task" id="entAdd">+ Add entity</button>
    <div class="ent-bar">
      <p class="rec-count" id="entCount"></p>
      <div class="ent-tools">
        <button type="button" class="icon-btn" id="entFilterBtn" aria-label="Sort and filter" title="Sort and filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg></button>
        <button type="button" class="ghost sm" id="entDetailsToggle">Hide details</button>
      </div>
    </div>
    <div class="ent-active" id="entActive" hidden></div>
    <p class="stub-note" id="entState" hidden></p>
    <div class="mk-list" id="entList" hidden></div>
  </div>
</main>

<div class="modal" id="entSheet" hidden>
  <div class="sheet small wide">
    <h3 id="entHeading">Add entity</h3>
    <div class="pe-top">
      <span id="entAvatar"></span>
      <div class="pe-btns">
        <button type="button" class="ghost sm" id="entPicUpload">Upload photo</button>
        <button type="button" class="ghost sm" id="entPicLink">Paste image link</button>
        <button type="button" class="ghost sm" id="entPicRemove" hidden>Remove photo</button>
      </div>
    </div>
    <div class="pay-add pe-link" id="entPicLinkField" hidden>
      <input type="url" id="entPicUrl" inputmode="url" autocomplete="off" maxlength="600" placeholder="https://example.com/photo.jpg">
      <button type="button" class="ghost sm" id="entPicUse">Use</button>
    </div>
    <div class="field">
      <label>Gender <small>(sets the blank profile picture)</small></label>
      <div class="radios">
        <label class="rad"><input type="radio" name="entGender" value="m"><span>Male</span></label>
        <label class="rad"><input type="radio" name="entGender" value="f"><span>Female</span></label>
        <label class="rad"><input type="radio" name="entGender" value="" checked><span>Not set</span></label>
      </div>
    </div>
    <div class="field">
      <label for="entName">Name</label>
      <input type="text" id="entName" autocomplete="off" placeholder="e.g. Kuya Rick">
    </div>
    <div class="field">
      <label for="entNick">Nickname <small>(optional, shown small after the name)</small></label>
      <input type="text" id="entNick" autocomplete="off" maxlength="40" placeholder="e.g. Kuya Rick">
    </div>
    <div class="field">
      <label for="entFlagC">Customer flag <small>(sold to)</small></label>
      <select id="entFlagC"></select>
    </div>
    <div class="field">
      <label for="entFlagS">Supplier flag <small>(bought from)</small></label>
      <select id="entFlagS"></select>
    </div>
    <label class="port-chk bl-chk"><input type="checkbox" id="entBl"><span>Blacklist &ndash; do not transact</span></label>
    <div class="field" id="entBlField" hidden><input type="text" id="entBlReason" maxlength="120" autocomplete="off" placeholder="Reason (optional)"></div>
    <div class="field">
      <label for="entContact">Contact number <small>(optional)</small></label>
      <input type="tel" id="entContact" inputmode="tel" autocomplete="off" placeholder="09xx xxx xxxx">
    </div>
    <div class="field">
      <label for="entAddress">Address <small>(optional)</small></label>
      <textarea id="entAddress" rows="3" maxlength="300" placeholder="Street, barangay, city, province, ZIP"></textarea>
    </div>
    <div class="field">
      <label for="entEmail">Email <small>(optional)</small></label>
      <input type="email" id="entEmail" inputmode="email" autocomplete="off" maxlength="120" placeholder="name@example.com">
    </div>
    <div class="field">
      <label for="entFb">Facebook profile link <small>(optional)</small></label>
      <input type="url" id="entFb" inputmode="url" autocomplete="off" maxlength="300" placeholder="https://facebook.com/...">
    </div>
    <div class="field">
      <label>Payment methods <small>(tap to select, or add your own)</small></label>
      <div class="pay-chips" id="entPayChips"></div>
      <div class="pay-add">
        <input type="text" id="entPayOther" maxlength="40" autocomplete="off" placeholder="Other method">
        <button type="button" class="ghost sm" id="entPayAdd">Add</button>
      </div>
    </div>
    <div class="field">
      <label for="entNotes">Notes <small>(optional)</small></label>
      <textarea id="entNotes" rows="3" maxlength="1000" placeholder="Anything worth remembering about this person"></textarea>
    </div>
    <p class="stub-note" id="entHint" style="margin:-6px 0 14px;font-size:12px;text-align:center" hidden>Renaming fixes the spelling on every receipt, card and finance entry. The old spelling is remembered, so typing it again still finds this entity.</p>
    <div class="acts">
      <button type="button" class="go sm" id="entSave">Save</button>
      <button type="button" class="ghost" id="entCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="modal" id="entView" hidden>
  <div class="sheet small wide pf-sheet">
    <div id="entViewBody"></div>
    <div class="ed-cards" id="entViewCards" hidden></div>
    <div class="acts" style="margin-top:14px">
      <button type="button" class="ghost" id="entViewLoad">Load purchased, sold &amp; traded cards</button>
      <button type="button" class="go sm" id="entViewEdit">Edit details</button>
      <button type="button" class="ghost" id="entViewClose">Close</button>
    </div>
  </div>
</div>

<div class="modal" id="sortSheet" hidden>
  <div class="sheet small wide">
    <h3>Sort entities</h3>
    <div class="field">
      <label for="flagFilter">Show only</label>
      <select id="flagFilter"></select>
    </div>
    <div class="so-list" id="sortOpts"></div>
    <div class="field" id="sortDirField">
      <label>Order</label>
      <div class="radios two">
        <label class="rad"><input type="radio" name="sortDir" value="most" checked><span>Most first</span></label>
        <label class="rad"><input type="radio" name="sortDir" value="least"><span>Least first</span></label>
      </div>
    </div>
    <div class="acts">
      <button type="button" class="go sm" id="sortDone">Done</button>
      <button type="button" class="ghost" id="sortReset">Reset sort &amp; filter</button>
      <button type="button" class="ghost" id="flagInfoBtn">How flags work</button>
    </div>
  </div>
</div>

<div class="modal" id="flagInfo" hidden>
  <div class="sheet small wide">
    <h3>How flags work</h3>
    <div id="flagInfoBody" class="fi-body"></div>
    <div class="acts"><button type="button" class="ghost" id="flagInfoClose">Close</button></div>
  </div>
</div>

<div class="modal" id="mergeSheet" hidden>
  <div class="sheet small wide">
    <h3>Merge entity</h3>
    <p class="stub-note" id="mergeText" style="margin:-6px 0 12px;font-size:12px;text-align:center"></p>
    <div class="field">
      <input type="search" id="mergeSearch" placeholder="Search the entity to keep" autocomplete="off">
    </div>
    <div class="rs-list" id="mergeList"></div>
    <div class="acts" style="margin-top:14px">
      <button type="button" class="go sm" id="mergeGo" disabled>Merge</button>
      <button type="button" class="ghost" id="mergeCancel">Cancel</button>
    </div>
  </div>
</div>
<input type="file" accept="image/*" id="entPicFile" hidden>
<div class="toast" id="mkToast" hidden></div>

<footer class="site-footer">
  <p>&copy;2026 Court Vision<br>All rights reserved.</p>
  <p>trackello <span class="ver">v1.2</span></p>
</footer>
<script src="boot.js"></script>
<script src="config.js"></script>
<script src="net.js"></script>
<script src="marketing.js"></script>
</body>
</html>
