<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trackello &ndash; Creatives</title>
<meta name="theme-color" content="#f7f7f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="trackello">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="hbar">
    <a href="index.html" class="back" aria-label="Back to home">&lsaquo;</a>
    <h2>Creatives</h2>
    <span class="hbar-spacer" aria-hidden="true"></span>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-ctab="video" role="tab">Video</button>
    <button type="button" class="tab" data-ctab="post" role="tab">Posts</button>
  </nav>
</header>

<main class="port-wrap">
  <div id="panelVideo">
    <div class="filter-chips" id="vFilters">
      <button type="button" class="chip active" data-f="todo">To do</button>
      <button type="button" class="chip" data-f="done">Done</button>
      <button type="button" class="chip" data-f="posted">Posted</button>
    </div>
    <button type="button" class="ghost add-task" id="vAdd">+ Add task</button>
    <p class="rec-count" id="vCount"></p>
    <p class="stub-note" id="vState">Loading&hellip;</p>
    <div class="port-list" id="vList" hidden></div>
  </div>

  <div id="panelPost" hidden>
    <div class="filter-chips" id="pFilters">
      <button type="button" class="chip active" data-f="toedit">To do</button>
      <button type="button" class="chip" data-f="edited">Done</button>
      <button type="button" class="chip" data-f="posted">Posted</button>
    </div>
    <button type="button" class="ghost add-task" id="pAdd">+ New post task</button>
    <div class="rec-tools" style="margin-bottom:10px"><button type="button" class="ghost sm" id="cRefresh">Refresh</button></div>
    <p class="rec-count" id="pCount"></p>
    <p class="stub-note" id="pState" hidden></p>
    <div class="port-list" id="pList" hidden></div>
  </div>
</main>

<!-- video task: add / edit -->
<div class="modal" id="vSheet" hidden>
  <div class="sheet small wide">
    <h3 id="vHeading">Add video task</h3>
    <div class="field"><label for="vTitle">Title</label><input type="text" id="vTitle" autocomplete="off" placeholder="e.g. Vlog: Unboxing 20 packs"></div>
    <div class="field"><label for="vDate">Scheduled date</label><input type="date" id="vDate"></div>
    <div class="field"><label for="vStatus">Status</label>
      <select id="vStatus"><option value="todo">To do</option><option value="done">Done</option><option value="posted">Posted</option></select>
    </div>
    <div class="field" id="vPlatWrap">
      <label>Uploaded to <small>(links can be added once Posted)</small></label>
      <div id="vPlats"></div>
    </div>
    <div class="field"><label for="vCaption">Caption <small>(to put on the video)</small></label><textarea id="vCaption" rows="4" maxlength="1500" placeholder="Caption for Facebook / Instagram / YouTube / TikTok&hellip;"></textarea></div>
    <div class="field"><label for="vNotes">Notes <small>(optional)</small></label><textarea id="vNotes" rows="3" maxlength="1000" placeholder="Ideas, footage location, reminders&hellip;"></textarea></div>
    <div class="acts">
      <button type="button" class="ghost" id="vCopy">Copy caption</button>
      <button type="button" class="go sm" id="vSave">Save</button>
      <button type="button" class="ghost" id="vCancel">Cancel</button>
    </div>
  </div>
</div>

<!-- post group: details -->
<div class="modal" id="pSheet" hidden>
  <div class="sheet small wide">
    <h3 id="pHeading">Post details</h3>
    <div class="field"><label for="pDate">Scheduled date</label><input type="date" id="pDate"></div>
    <label class="port-chk"><input type="checkbox" id="pPosted"><span>Posted (marks every card edited; links can be added)</span></label>
    <div class="field">
      <label>Posted to</label>
      <div id="pPlats"></div>
    </div>
    <div class="field"><label for="pCaption">Caption <small>(to put on the post)</small></label><textarea id="pCaption" rows="4" maxlength="1500" placeholder="Caption for Facebook / Instagram&hellip;"></textarea></div>
    <div class="field"><label for="pNotes">Notes <small>(optional)</small></label><textarea id="pNotes" rows="3" maxlength="1000"></textarea></div>
    <div class="acts">
      <button type="button" class="ghost" id="pCopy">Copy caption</button>
      <button type="button" class="go sm" id="pSave">Save</button>
      <button type="button" class="ghost" id="pCancel">Cancel</button>
    </div>
  </div>
</div>

<!-- post task: new / add cards / merge -->
<div class="modal" id="mSheet" hidden>
  <div class="sheet small wide">
    <h3 id="mHeading">New post task</h3>
    <div class="field"><label for="mTitle">Title</label><input type="text" id="mTitle" autocomplete="off" placeholder="e.g. Weekend pickups"></div>
    <div class="field"><label for="mDate">Scheduled date</label><input type="date" id="mDate"></div>
    <div class="field" id="mMergeWrap" hidden>
      <label>Merge with other tasks <small>(adds all their cards)</small></label>
      <div id="mMerge" class="m-merge"></div>
    </div>
    <div class="field">
      <label>Cards <small id="mCount"></small></label>
      <input type="search" id="mSearch" placeholder="Search cards" autocomplete="off">
      <div id="mCards" class="m-cards"></div>
    </div>
    <div class="acts">
      <button type="button" class="go sm" id="mSave">Save</button>
      <button type="button" class="ghost" id="mCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="modal" id="imgView" hidden>
  <div class="sheet small">
    <img id="imgViewImg" alt="">
    <div class="acts"><button type="button" class="ghost" id="imgViewClose">Close</button></div>
  </div>
</div>
<div class="toast" id="crToast" hidden></div>

<footer class="site-footer">
  <p>&copy;2026 Court Vision<br>All rights reserved.</p>
  <p>trackello <span class="ver">v1.2</span></p>
</footer>
<script src="boot.js"></script>
<script src="config.js"></script>
<script src="net.js"></script>
<script src="creatives.js"></script>
</body>
</html>
